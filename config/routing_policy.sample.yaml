policy_id: "ja-routing-policy"
policy_version: "2026-07"
intent_types:
  - id: "pest_symptom_report"
    capability: "pest_disease_consultation"
    mapping_rule_id: "map-pest"
    base_priority: "high"
  - id: "machinery_booking"
    capability: "machinery_service"
    mapping_rule_id: "map-machinery"
    base_priority: "normal"
  - id: "subsidy_inquiry"
    capability: "subsidy_program"
    mapping_rule_id: "map-subsidy"
    base_priority: "normal"
  - id: "procurement_request"
    capability: "procurement"
    mapping_rule_id: "map-procurement"
    base_priority: "normal"
  - id: "shipment_coordination"
    capability: "sales_shipment"
    mapping_rule_id: "map-shipment"
    base_priority: "normal"
  - id: "other_general"
    capability: "other_general"
    mapping_rule_id: "map-general"
    base_priority: "low"
missing_field_reasons:
  crop: "対象作物の特定に必要です"
  growth_stage: "生育状況の確認に必要です"
  parcel: "対象圃場の特定に必要です"
  symptom: "相談内容の整理に必要です"
  deadline: "予約枠の確保に必要です"
  quantity: "必要量の確認に必要です"
  machine: "対象機械の特定に必要です"
  program: "対象制度の特定に必要です"
  unspecified: "用件の切り分けに必要です"
priority_escalation:
  - when_intent_has_field: "symptom"
    and_crop_in_critical_window: true
    escalate_to: "critical"
